name: CI and CD for Longboi Life
on:
  push:
    branches: ['**']
    tags: ['v[0-9]+.[0-9]+.[0-9]+']
  pull_request:
    branches: ['main']

jobs:

  # --- --- --- --- START OF BUILD JOB --- --- --- ---

  build:
    runs-on: ubuntu-latest
    outputs:
      PROJECT_VERSION: ${{ steps.extract_version.outputs.PROJECT_VERSION }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      # Configure Gradle for optimal use in GitHub Actions, including caching of downloaded dependencies.
      # See: https://github.com/gradle/actions/blob/main/setup-gradle/README.md
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@af1da67850ed9a4cedd57bfd976089dd991e2582 # v4.0.0

      # This will create a jar, run the tests and generate a Jacoco test report
      - name: Build with Gradle Wrapper
        run: ./gradlew build

      # Extract PROJECT_VERSION using Gradle and set it as both env variable and job output
      - name: Extract Version from Gradle
        id: extract_version
        run: |
          # Execute the Gradle task to print the version
          VERSION=$(./gradlew printVersion -q)   # e.g., v0.0.4

          # Output the extracted version to the console (optional)
          echo "Extracted Version: $VERSION"

          # Set the environment variable for subsequent steps in this job
          echo "PROJECT_VERSION=$VERSION" >> $GITHUB_ENV

          # Set the job output for use in other jobs
          echo "PROJECT_VERSION=$VERSION" >> $GITHUB_OUTPUT
        shell: bash

      # === === === === === === === === === ===

      # This has been commented out to save space on GH action storage
      # Each JAR file is ~30MB and we only get 500MB a month... there is less than
      # a month left on this project, have to use what we have wisely
      # Upload all generated artifacts
      # - name: Upload JAR as workflow artifact
      #   uses: actions/upload-artifact@v4
      #   with:
      #     compression-level: 0
      #     name: longboi-life-${{ env.PROJECT_VERSION }}.jar
      #     path: lwjgl3/build/libs/longboi-life-${{ env.PROJECT_VERSION }}.jar

      - name: Upload test report as workflow artifact
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: test-report
          path: headless/build/reports/tests/test/

      - name: Upload Jacoco report as workflow artifact
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: jacoco-report
          path: headless/build/reports/jacoco/test/html/

      - name: Upload Checkstyle Reports
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: checkstyle-reports
          path: |
            core/build/reports/checkstyle/*.html
            headless/build/reports/checkstyle/*.html
            lwjgl3/build/reports/checkstyle/*.html

      # === === === === === === === === === ===

  # --- --- --- --- END OF BUILD JOB --- --- --- ---

  # --- --- --- --- START OF DEPENDENCY SUBMISSION JOB --- --- --- ---

  dependency-submission:
    runs-on: ubuntu-latest
    needs: build
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      # Generates and submits a dependency graph, enabling Dependabot Alerts for all project dependencies.
      # See: https://github.com/gradle/actions/blob/main/dependency-submission/README.md
      - name: Generate and submit dependency graph
        uses: gradle/actions/dependency-submission@af1da67850ed9a4cedd57bfd976089dd991e2582 # v4.0.0

  # --- --- --- --- END OF DEPENDENCY SUBMISSION JOB --- --- --- ---

  # --- --- --- --- START OF RELEASE JOB --- --- --- ---

  release:
    runs-on: ubuntu-latest
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Create folder for artifacts
        run: |
          mkdir downloaded-artifacts
          ls

      # Download JAR from build job
      - uses: actions/download-artifact@v4
        with:
          name: longboi-life-${{ needs.build.outputs.PROJECT_VERSION }}.jar
          path: ./downloaded-artifacts

      # FOR TESTING ONLY
      - name: Make sure that artifact is in the correct place
        run: ls downloaded-artifacts

      # Create release using the JAR downloaded
      - name: Create Release
        run: gh release create "v${{ needs.build.outputs.PROJECT_VERSION }}" --draft --generate-notes downloaded-artifacts/longboi-life-${{ needs.build.outputs.PROJECT_VERSION }}.jar
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # --- --- --- --- END OF RELEASE JOB --- --- --- ---
