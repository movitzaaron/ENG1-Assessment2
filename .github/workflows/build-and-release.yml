name: Build and Release
on:
  push:
    tags:
      - 'v*.*.*' # Triggers on a push with a tag like v1.2.3
jobs:
  release:
    runs-on: ubuntu-latest
    permissions: write-all
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@af1da67850ed9a4cedd57bfd976089dd991e2582 # v4.0.0
      # - name: Extract Project Version
      #   run: |
      #     VERSION=$(./gradlew printVersion -q)
      #     echo "PROJECT_VERSION=${VERSION}" >> $GITHUB_ENV
      #   shell: bash
      - name: Extract Version from Tag
        id: extract_version
        run: |
          TAG_NAME=${GITHUB_REF#refs/tags/}   # e.g., v0.0.4
          VERSION=${TAG_NAME#v}               # e.g., 0.0.4
          echo "Extracted Version: $VERSION"
          echo "PROJECT_VERSION=$VERSION" >> $GITHUB_ENV
        shell: bash
      - name: Create Source ZIP
        run: git archive -o source-code.zip HEAD
      - name: Create Source TAR.GZ
        run: git archive --format=tar.gz -o source-code.tar.gz HEAD
      - name: Build Project
        run: |
          ./gradlew lwjgl3:dist
          ls lwjgl3/build/libs/
          ls
      - name: Create Release
        run: gh release create "v${{ env.PROJECT_VERSION }}" --draft --generate-notes lwjgl3/build/libs/longboi-life-${{ env.PROJECT_VERSION }}.jar source-code.zip source-code.tar.gz
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
