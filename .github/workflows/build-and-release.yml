name: Build and Release
on:
  push:
    tags:
      - 'v*.*.*' # Triggers on a push with a tag like v1.2.3
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3
      - name: Extract Project Version
        run: |
          VERSION=$(./gradlew printVersion -q)
          echo "PROJECT_VERSION=${VERSION}" >> $GITHUB_ENV
        shell: bash
      - name: Build Project
        run: ./gradlew lwjgl3:dist
      - name: Create Source ZIP
        run: git archive -o source-code.zip HEAD
      - name: Create Source TAR.GZ
        run: git archive --format=tar.gz -o source-code.tar.gz HEAD
      - name: Create Release
        run: gh release create "Release v${{ env.PROJECT_VERSION }}" --draft --generate-notes lwjgl3/build/libs/longboi-life-${{ env.PROJECT_VERSION }}.jar source-code.zip source-code.tar.gz
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
